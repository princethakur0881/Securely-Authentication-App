
spring.application.name=Full-stack-Secure-Authentication-Ecosystem
server.port=8080
#Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/FullStackSecureAuthenticationEcosystemApplication}
spring.datasource.username=${DB_USERNAME:authuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
app.mail.from=${MAIL_USERNAME}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email verification
#app.mail.from=${spring.mail.username}
#app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
#app.verification.base-url=${APP_VERIFICATION_BASE_URL:http://localhost:3000/?verify=1}
#app.password-reset.base-url=${APP_PASSWORD_RESET_BASE_URL:http://localhost:3000/#/reset-password}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.verification.base-url=${APP_FRONTEND_URL:http://localhost:3000}/?verify=1
app.password-reset.base-url=${APP_FRONTEND_URL:http://localhost:3000}/#/reset-password

#JWT
jwt.expiration=${JWT_EXPIRATION:360000}